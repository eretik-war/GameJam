<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none';">
  <title>GameJam · сцена</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <main id="app">
    <section class="battlefield" aria-label="Боевая сцена">
      <div id="scene" role="group" aria-label="Герой слева, противники справа. Нажмите на противника для выбора."></div>
    </section>
    <footer class="debug">
      <div class="debug-heading"><h1>Debug</h1><strong id="turn">Ход 1</strong></div>
      <section id="parameters" aria-live="polite"></section>
      <div class="actions"><button id="end-turn">Начало следующего хода</button><button id="restore">Нанести 12 урона</button><button id="burn">Горение · +3 хода</button><button id="save">Сохранить</button><button id="load">Загрузить</button></div>
      <p id="status" role="status">Запуск…</p>
    </footer>
  </main>
  <script>/*__ENGINE__*/</script>
  <script>/*__GAME__*/</script>
</body>
</html>
